version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: samanvay-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - samanvay-db:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/samanvay.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: samanvay-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  samanvay-db:
